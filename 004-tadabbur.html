<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="header.js"></script>
  <title>Tadabbur Ad-Dhuha - An-Nas</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: monospace;
    color: #e8eaed;
    overflow: hidden;
  }
  /* Controls bar */
  #controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .2rem;
    padding: .2rem .8rem;
    background: #000000;
    z-index: 10;
  }
  #controls input, #controls select, #controls button {
    background: #0b0d10;
    color: #e8eaed;
    border: 1px solid #222831;
    border-radius: .25rem;
    padding: .25rem .5rem;
    font-family: monospace;
  }
  #controls button {
    cursor: pointer;
  }
  #viewerContainer {
    flex: 1 1 auto;
    overflow: auto;
    background: #ffffff;
  }
  .pdfViewer .page {
    margin: 20px auto;
    box-shadow: 0 0 12px rgba(0,0,0,.45);
    border-radius: .5rem;
    overflow: hidden;
  }
  .textLayer ::selection { 
      background: rgb(108, 255, 118); 
  }
</style>

<!-- PDF.js base CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
<link rel="stylesheet" href="pdfstyle.css">

</head>
<body>
  <!-- Controls -->
  <div id="controls">
    <header3-component></header3-component>
    <label>M/s:
      <button id="prevBtn">Prev</button>
      <input type="number" id="pageInput" value="1" min="1" style="width:4rem">
      <button id="goBtn">Go</button>
      <button id="nextBtn">Next</button>
    </label>
    <span id="pageCount">/ ?</span>

    <label style="margin-left:1rem">Zoom:
      <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="page-width">Fit W</option>
      </select>
    </label>
  </div>

  <!-- PDF container -->
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <!-- PDF.js scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const container = document.getElementById("viewerContainer");
    const eventBus = new pdfjsViewer.EventBus();
    const linkService = new pdfjsViewer.PDFLinkService({ eventBus });
    const findController = new pdfjsViewer.PDFFindController({ eventBus, linkService });

    const viewer = new pdfjsViewer.PDFViewer({
      container,
      eventBus,
      linkService,
      findController,
      textLayerMode: 2,
    });

    document.getElementById("viewer").appendChild(viewer.viewer);
    linkService.setViewer(viewer);

    let pdfDoc = null;

    eventBus.on("pagesinit", () => {
      if (window.innerWidth < 768) {
        viewer.currentScaleValue = "page-width"; // phones/tablets
      } else {
        viewer.currentScaleValue = "auto";       // desktops
      }
      document.getElementById("pageCount").textContent = "/ " + pdfDoc.numPages;
      document.getElementById("pageInput").max = pdfDoc.numPages;
    });

    eventBus.on("pagechanging", (e) => {
      document.getElementById("pageInput").value = e.pageNumber;
    });

    async function openPDF(url) {
      const loadingTask = pdfjsLib.getDocument(url);
      pdfDoc = await loadingTask.promise;
      viewer.setDocument(pdfDoc);
      linkService.setDocument(pdfDoc, null);
    }

    // Load local PDF
    openPDF("004-tadabbur.pdf");

    function goToPage(page) {
      if (page > 0 && page <= pdfDoc.numPages) {
        viewer.currentPageNumber = page;
      } else {
        document.getElementById("pageInput").value = viewer.currentPageNumber;
      }
    }

    // Enter key on input
    document.getElementById("pageInput").addEventListener("keyup", (e) => {
      if (e.key === "Enter") {
        goToPage(parseInt(e.target.value, 10));
      }
    });

    // Go button
    document.getElementById("goBtn").addEventListener("click", () => {
      const page = parseInt(document.getElementById("pageInput").value, 10);
      goToPage(page);
    });

    // Prev button
    document.getElementById("prevBtn").addEventListener("click", () => {
      goToPage(viewer.currentPageNumber - 1);
    });

    // Next button
    document.getElementById("nextBtn").addEventListener("click", () => {
      goToPage(viewer.currentPageNumber + 1);
    });

    // Zoom control
    document.getElementById("zoomSelect").addEventListener("change", (e) => {
      viewer.currentScaleValue = e.target.value;
    });
  </script>
</body>
</html>
