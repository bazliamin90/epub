<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="header.js"></script>
<title>Al-masad</title>

<style>

/* =========================
BASE
========================= */

body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
  overflow:hidden;
}

/* =========================
NAVBAR
========================= */

#navbar{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  z-index:999;
  width:100%;
  display:flex;
  gap:.5rem;
  align-items:center;
  background:white;
  padding:.7rem 1rem;
  box-shadow:0 0 15px rgba(0,0,0,.1);
}

/* =========================
VIEWER WRAPPER
========================= */

#viewerContainer{
  position:absolute;
  top:4.5rem;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  overflow:hidden;
  z-index: 1;
}

/* =========================
SCROLL AREA (IMPORTANT)
========================= */

#scrollArea{
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  box-shadow:0 0 15px rgba(0,0,0,.1);
}

/* iframe inside scroll container */
#docFrame{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<div id="navbar">
  <header3-component></header3-component>
  <input
    type="text"
    id="searchInput"
    placeholder="Search..."
>
  <button id="findPrev">◀</button>
  <button id="findNext">▶</button>
</div>

<div id="viewerContainer">
  <div id="scrollArea">
    <iframe id="docFrame"></iframe>
  </div>
</div>

<script>

// =========================
// DOC CONFIG
// =========================

const docId =
  "1yDr5UaqtQgElt5VqvAtCnCviSJGNxDPmWAJnw1lDcnU";

// BEST STABLE MODE (NO DOWNLOAD, NO SIGN-IN ISSUE)
const url =
  `https://docs.google.com/document/d/${docId}/preview?embedded=true`;

const frame =
  document.getElementById("docFrame");

frame.src = url;

// =========================
// SEARCH (IFRAME FIND)
// =========================

function search(dir){

  const query =
    document.getElementById("searchInput")
      .value;

  if(!query) return;

  const win =
    frame.contentWindow;

  // built-in browser iframe search
  win.find(
    query,
    false,
    dir === "back",
    true,
    false,
    false,
    false
  );
}

document
  .getElementById("findNext")
  .onclick = () => search("forward");

document
  .getElementById("findPrev")
  .onclick = () => search("back");

document
  .getElementById("searchInput")
  .addEventListener("keydown", e => {

    if(e.key === "Enter"){
      search("forward");
    }

  });

</script>

</body>
</html>
