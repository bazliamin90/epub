<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="header.js"></script>
<title>Al-masad</title>

<style>
body{
    margin:0;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow: hidden;
  }

iframe{
  flex:1;
  width:100%;
  height:100vh;
  background:white;
  display:flex;
  margin: 0 auto;
}

#navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid black;
      padding: 0.5rem;
      width: 100vw;
      display: flex;
      margin: 0 auto;
      flex-direction: row;
      gap: 0.5rem;
      background: white;
    }
</style>
</head>
<body>

<div id="navbar">
    <header3-component></header3-component>
    <label>
      <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="page-width">Fit W</option>
        <option value="page-height">Fit H</option>
      </select>
    </label>
    <div id="pageinput">
      <label>
        <input type="number" id="pageInput" value="1" min="1" style="width:3rem">
      </label>
    <span id="pageCount" style="margin-left: 5px;">/--</span>
    </div>
    <input type="range" id="pageSlider" min="2" max="1" value="2" style="width:6rem">
  </div>

  <iframe
