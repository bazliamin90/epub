<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Viewer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* NAVBAR */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #1e1e1e;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }

    #navbar button {
      background: #333;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    #navbar input {
      width: 80px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
    }

    /* VIEWER WRAPPER */
    #viewerWrapper {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100vh - 50px);
      overflow: hidden;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: 0 0;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div id="navbar">
    <span>Zoom:</span>
    <input id="zoom" type="number" value="100" min="50" max="200" onchange="setZoom()" />%

    <button onclick="setZoom(80)">80%</button>
    <button onclick="setZoom(100)">100%</button>
    <button onclick="setZoom(120)">120%</button>
  </div>

  <!-- VIEWER -->
  <div id="viewerWrapper">
    <iframe
      id="doc"
      src="https://docs.google.com/document/d/1r5iPr4PfIN0pkKpObSzJpbST79SclDAmUrGI7MDkW-Y/preview">
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById("doc");
    const zoomInput = document.getElementById("zoom");

    function setZoom(val) {
      if (val) zoomInput.value = val;

      const zoom = zoomInput.value / 100;

      // scale iframe content
      iframe.style.transform = `scale(${zoom})`;

      // adjust size so scroll stays correct
      iframe.style.width = (100 / zoom) + "%";
      iframe.style.height = (100 / zoom) + "%";
    }

    // initial zoom
    setZoom(100);
  </script>

</body>
</html>
